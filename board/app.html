<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components Board</title>
<!-- Run: python3 -m http.server 8080 -d board/
     Open: http://localhost:8080/app.html -->
<style>
:root {
  --bg: #1a1a1a; --bg2: #222; --bg3: #2a2a2a; --border: #333;
  --text: #eee; --text2: #aaa; --text3: #666;
  --green: #007C3D; --green2: #009948;
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: var(--sans); background: var(--bg); color: var(--text); }

/* Layout: menu | page-tabs + main | status */
.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; }

/* Menu bar */
.menu-bar { display: flex; align-items: center; padding: 2px 12px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 12px; gap: 4px; }
.menu-bar .logo { color: var(--green); font-weight: 700; font-size: 14px; margin-right: 8px; }
.menu-bar button { background: none; border: none; color: var(--text2); padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
.menu-bar button:hover { background: #333; color: var(--text); }

/* Page tabs */
.page-tabs { display: flex; gap: 1px; padding: 0 8px; background: var(--bg2); border-bottom: 1px solid var(--border); align-items: end; }
.page-tab { padding: 5px 16px; font-size: 12px; color: var(--text2); cursor: pointer; border-radius: 4px 4px 0 0; background: var(--bg3); border: 1px solid var(--border); border-bottom: none; margin-bottom: -1px; }
.page-tab.active { background: var(--bg); color: var(--green); border-color: var(--border); }
.page-tab-add { background: none; border: 1px dashed var(--text3); color: var(--text3); }
.page-tab-add:hover { border-color: var(--green); color: var(--green); }

/* Main area: tool rail | viewport | splitter | right panel */
.main { display: grid; grid-template-columns: 44px 1fr 6px 360px; overflow: hidden; }
.main.collapsed { grid-template-columns: 44px 1fr 0px 0px; }
.main.collapsed .splitter-h, .main.collapsed .right-panel { display: none; }

/* Horizontal splitter (viewport ↔ right panel) */
.splitter-h { background: var(--border); cursor: col-resize; display: flex; align-items: center; justify-content: center; z-index: 5; user-select: none; }
.splitter-h:hover, .splitter-h.active { background: var(--green); }
.splitter-h::after { content: '⋮'; color: var(--text3); font-size: 14px; }
.splitter-h:hover::after, .splitter-h.active::after { color: #fff; }

/* Collapse/expand button on viewport top-right */
.collapse-btn { position: absolute; top: 8px; right: 8px; z-index: 10; width: 26px; height: 26px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.collapse-btn:hover { border-color: var(--green); color: var(--green); }

/* Tool rail */
.tool-rail { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 2px; }
.tool-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; background: none; color: var(--text2); border-radius: 4px; cursor: pointer; font-size: 14px; position: relative; }
.tool-btn:hover { background: #333; color: var(--text); }
.tool-btn.active { background: var(--green); color: #fff; }
.tool-btn .tip { display: none; position: absolute; left: 44px; background: #333; color: var(--text); padding: 4px 8px; border-radius: 3px; font-size: 11px; white-space: nowrap; z-index: 10; }
.tool-btn:hover .tip { display: block; }

/* Viewport */
.viewport { background: #f8f8f8; position: relative; overflow: hidden; }
.viewport svg { width: 100%; height: 100%; display: block; }

/* Right panel: editor + vertical splitter + terminal */
.right-panel { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; min-width: 0; }

/* Vertical splitter (editor ↔ terminal) */
.splitter-v { height: 6px; background: var(--border); cursor: row-resize; display: flex; align-items: center; justify-content: center; flex-shrink: 0; user-select: none; }
.splitter-v:hover, .splitter-v.active { background: var(--green); }
.splitter-v::after { content: '···'; color: var(--text3); font-size: 10px; letter-spacing: 2px; }
.splitter-v:hover::after, .splitter-v.active::after { color: #fff; }

.editor-pane { display: flex; flex-direction: column; overflow: hidden; flex: 1; min-height: 80px; }
.terminal-pane { display: flex; flex-direction: column; overflow: hidden; min-height: 80px; height: 240px; }
.editor-tabs { display: flex; align-items: center; padding: 0; background: var(--bg2); border-bottom: 1px solid var(--border); }
.ed-tab { padding: 6px 14px; font-size: 11px; color: var(--text2); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; font-family: var(--sans); }
.ed-tab:hover { color: var(--text); }
.ed-tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }
.ed-tab-info { margin-left: auto; padding-right: 10px; font-size: 10px; color: var(--text3); }
.editor-body { flex: 1; overflow-y: auto; font: 12px/1.6 var(--mono); padding: 4px 0; }
.editor-body.hidden { display: none; }
.editor-textarea { flex: 1; resize: none; border: none; outline: none; background: #1e1e1e; color: #ccc; font: 12px/1.6 var(--mono); padding: 8px 12px; tab-size: 2; }
.editor-textarea.hidden { display: none; }
.editor-textarea:focus { background: #1f1f1f; }
.ed-line { display: flex; padding: 0 8px; }
.ed-line:hover { background: #252525; }
.ed-line.hl { background: #1a3a1a; border-left: 3px solid var(--green); }
.ed-ln { color: var(--text3); min-width: 28px; text-align: right; padding-right: 10px; user-select: none; }
.ed-code { color: #ccc; white-space: pre; }
.ed-code .kw { color: #569CD6; } .ed-code .ref { color: #DCDCAA; }
.ed-code .str { color: #CE9178; } .ed-code .pg { color: #C586C0; font-weight: bold; }
.ed-code .num { color: #B5CEA8; } .ed-code .cmt { color: #6A9955; }

/* Terminal (Python IDLE style) */
.terminal-pane { display: flex; flex-direction: column; overflow: hidden; background: #fffff8; border-top: 1px solid var(--border); }
.terminal-header { display: flex; align-items: center; padding: 3px 10px; background: #e8e8e0; border-bottom: 1px solid #ccc; }
.terminal-title { font: bold 11px var(--sans); color: #333; }
.terminal-ver { margin-left: auto; font-size: 10px; color: #888; }
.terminal-body { flex: 1; overflow-y: auto; padding: 6px 10px; font: 12px/1.5 var(--mono); color: #333; }
.terminal-body .term-banner { color: #666; }
.terminal-body .ok { color: #006400; }
.terminal-body .err { color: #8b0000; }
.terminal-body .info { color: #555; }
.terminal-body .result { color: #00008b; }
.terminal-input-row { display: flex; align-items: center; padding: 4px 10px; background: #fffff8; border-top: 1px solid #ddd; }
.terminal-prompt { color: #006400; font: bold 12px var(--mono); margin-right: 6px; }
.terminal-input { flex: 1; background: transparent; border: none; color: #333; font: 12px var(--mono); outline: none; }

/* Status bar */
.status-bar { display: flex; align-items: center; padding: 3px 12px; background: var(--bg2); border-top: 1px solid var(--border); font-size: 11px; color: var(--text2); gap: 16px; }
.status-bar .active-tool { color: var(--green); font-weight: 600; }
</style>
</head>
<body>
<div class="app">

  <!-- Menu bar -->
  <div class="menu-bar">
    <span class="logo">C</span>
    <button>File</button><button>Edit</button><button>View</button>
    <button>Project</button><button>Simulate</button><button>Help</button>
  </div>

  <!-- Page tabs -->
  <div class="page-tabs" id="page-tabs">
    <div class="page-tab active" data-page="CPU">CPU</div>
    <div class="page-tab" data-page="Memory">Memory</div>
    <div class="page-tab" data-page="ALU">ALU</div>
    <div class="page-tab page-tab-add">+</div>
  </div>

  <!-- Main area -->
  <div class="main">
    <!-- Tool rail -->
    <div class="tool-rail" id="tool-rail"></div>

    <!-- Viewport -->
    <div class="viewport" id="viewport">
      <svg id="svg"></svg>
      <button class="collapse-btn" id="collapse-btn" title="Toggle panel (Ctrl+B)">◀</button>
    </div>

    <!-- Horizontal splitter (drag to resize viewport ↔ right panel) -->
    <div class="splitter-h" id="splitter-h"></div>

    <!-- Right panel: tabbed editor + vertical splitter + terminal -->
    <div class="right-panel" id="right-panel">
      <!-- Editor tabs -->
      <div class="editor-pane" id="editor-pane">
        <div class="editor-tabs">
          <button class="ed-tab active" data-ed="circuit">Components:circuit</button>
          <button class="ed-tab" data-ed="board">Components:board</button>
          <span class="ed-tab-info" id="ed-page-info">CPU</span>
        </div>
        <textarea class="editor-textarea" id="circuit-editor" spellcheck="false" wrap="off"></textarea>
        <textarea class="editor-textarea hidden" id="board-editor" spellcheck="false" wrap="off"></textarea>
      </div>
      <!-- Vertical splitter (drag to resize editor ↔ terminal) -->
      <div class="splitter-v" id="splitter-v"></div>
      <!-- Terminal (Python IDLE style) -->
      <div class="terminal-pane" id="terminal-pane">
        <div class="terminal-header">
          <span class="terminal-title">Components Shell</span>
          <span class="terminal-ver">v1.0</span>
        </div>
        <div class="terminal-body" id="cmd-log">
          <div class="term-banner">Components Board Engine — 929 tests verified</div>
          <div class="term-banner">Type commands, or use tools in the viewport.</div>
          <div class="term-banner">───────────────────────────────────────────</div>
        </div>
        <div class="terminal-input-row">
          <span class="terminal-prompt">&gt;&gt;&gt;</span>
          <input class="terminal-input" id="cmd-input" placeholder="" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span class="active-tool" id="st-tool">Select</span>
    <span id="st-pos">x: 0.0  y: 0.0 mm</span>
    <span id="st-zoom">100%</span>
    <span id="st-paper">A4 Landscape</span>
    <span style="margin-left:auto" id="st-save"></span>
    <span id="st-tests">929 tests ✓</span>
  </div>

</div>

<script type="module">
// ============================================================================
// IMPORTS — all from our engine modules (Phases 1-5)
// ============================================================================
import { parseCommand } from './src/controller/parser.js';
import { createExecutor } from './src/controller/executor.js';
import { createEngine } from './src/controller/engine.js';
import { createViewport } from './src/view/viewport.js';
import { createStatusBar } from './src/view/status-bar.js';
import { createPageTabs } from './src/view/page-tabs.js';
import { parseFile, FILE_TYPES, getPageNames } from './src/model/file.js';
import { createEditor, highlightAndScroll, getText, getLineCount } from './src/view/editor.js';
import { syncToPage, syncToDevice, getCurrentPage } from './src/controller/sync.js';
import { createToolSystem } from './src/controller/tools.js';
import { createSelectTool } from './src/controller/select-tool.js';
import { createConnectTool } from './src/controller/connect-tool.js';
import { syncStateToText, syncTextToEngine } from './src/controller/twin-sync.js';

// ============================================================================
// SAMPLE PROJECT (would normally load from disk)
// ============================================================================
const CIRCUIT_SRC = `@page CPU
device U1, digital.74HC04;
device U2, digital.74HC161;
device U5, digital.74HC86;
connect U1.1Y -> U2.CLK;
connect U5.1Y -> U2.ENP;

@page Memory
device U3, memory.62256;
device U4, memory.AT28C256;
connect U2.QA -> U3.A0;
connect U2.QB -> U3.A1;

@page ALU
device U10, digital.74HC283;
device U11, digital.74HC86;
connect U10.S0 -> U11.1A;`;

const BOARD_SRC = `@page CPU
paper A4 landscape;
place U1 at (30, 40) rotate 0;
place U2 at (100, 40) rotate 0;
place U5 at (30, 80) rotate 0;
route U1.1Y -> U2.CLK via (65, 40) (65, 30) (100, 30);

@page Memory
paper A3 landscape;
place U3 at (60, 30) rotate 0;
place U4 at (60, 80) rotate 0;

@page ALU
paper A4 landscape;
place U10 at (40, 40) rotate 0;
place U11 at (120, 40) rotate 90;
route U10.S0 -> U11.1A via (80, 40) (80, 30) (120, 30);`;

// ============================================================================
// ENGINE SETUP
// ============================================================================
const STORAGE_KEY = 'components.board.project.v1';
const executor = createExecutor();
const engine = createEngine({ parser: parseCommand, executor });
const viewport = createViewport(engine.getState().config);
const statusBar = createStatusBar(engine, viewport);
const pageTabs = createPageTabs(engine);
const toolSystem = createToolSystem();
const selectTool = createSelectTool();
const connectToolInst = createConnectTool();

// Interaction state
let selectedRef = null;
let dragState = null; // { ref, startWorld, startScreen }
let connectPreview = null; // SVG line preview during connect

// File models + editors
let CIRCUIT_SRC_LIVE = CIRCUIT_SRC;
let BOARD_SRC_LIVE = BOARD_SRC;
let circuitFile = parseFile(CIRCUIT_SRC, FILE_TYPES.CIRCUIT);
let boardFile = parseFile(BOARD_SRC, FILE_TYPES.BOARD);
let circuitEditor = createEditor(CIRCUIT_SRC, { visibleLines: 30 });
let boardEditor = createEditor(BOARD_SRC, { visibleLines: 30 });
let activePage = 'CPU';

// ============================================================================
// SAVE / LOAD (localStorage)
// ============================================================================
function saveProject() {
  const data = { circuit: CIRCUIT_SRC_LIVE, board: BOARD_SRC_LIVE, commands: engine.getLog?.() || [], activePage };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    document.getElementById('st-save').textContent = '● Saved';
    setTimeout(() => { document.getElementById('st-save').textContent = ''; }, 1500);
  } catch(e) { /* quota exceeded, ignore */ }
}

function loadProject() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.circuit) CIRCUIT_SRC_LIVE = data.circuit;
    if (data.board) BOARD_SRC_LIVE = data.board;
    if (data.activePage) activePage = data.activePage;
    circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT);
    boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD);
    circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 });
    boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 });
    if (data.commands?.length) {
      data.commands.forEach(cmd => engine.run(cmd));
      cmdLog(`(loaded ${data.commands.length} commands from save)`, true);
      return true;
    }
  } catch(e) { /* corrupt, ignore */ }
  return false;
}

// Seed engine — try loading saved project first, else use defaults
if (!loadProject()) {
  const INIT_COMMANDS = [
    'place U1, digital.74HC04 at (30, 40) rotate 0',
    'place U2, digital.74HC161 at (100, 40) rotate 0',
    'place U5, digital.74HC86 at (30, 80) rotate 0',
    'connect U1.1Y -> U2.CLK',
    'connect U5.1Y -> U2.ENP',
    'route U1.1Y -> U2.CLK via (65, 40) (65, 30) (100, 30)',
  ];
  INIT_COMMANDS.forEach(cmd => engine.run(cmd));
}

// Auto-save after every command + sync texts from state (visual → text)
function runAndSave(text) {
  const result = engine.run(text);
  cmdLog(text, result.success);
  if (result.success) {
    // Twin sync: engine state → regenerate both text files
    const state = engine.getState();
    const texts = syncStateToText(state);
    if (texts.circuit) {
      CIRCUIT_SRC_LIVE = texts.circuit;
      circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT);
      circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 });
    }
    if (texts.board) {
      BOARD_SRC_LIVE = texts.board;
      boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD);
      boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 });
    }
    renderEditors();
  }
  renderViewport();
  updateStatus();
  saveProject();
  return result;
}

// ============================================================================
// TOOL RAIL
// ============================================================================
const TOOL_ICONS = { select: '↖', tray: '▣', guide: '↝', connect: '⌁', eraser: '✕', label: 'T', inspect: '⌕', more: '⋯' };

function renderToolRail() {
  const tools = toolSystem.list();
  const active = toolSystem.getActive();
  document.getElementById('tool-rail').innerHTML = tools.map(t => `
    <button class="tool-btn${t.id === active?.id ? ' active' : ''}" data-tool="${t.id}" title="${t.name} (${t.shortcut})">
      ${TOOL_ICONS[t.id] || '•'}
      <span class="tip">${t.name} (${t.shortcut})</span>
    </button>
  `).join('');
}

document.getElementById('tool-rail').addEventListener('click', e => {
  const btn = e.target.closest('[data-tool]');
  if (btn) { toolSystem.activate(btn.dataset.tool); renderToolRail(); updateStatus(); }
});

// ============================================================================
// EDITORS (tabbed — editable textareas, load/save/edit)
// ============================================================================
let activeEditorTab = 'circuit'; // 'circuit' or 'board'

function renderEditors() {
  document.getElementById('circuit-editor').value = CIRCUIT_SRC_LIVE;
  document.getElementById('board-editor').value = BOARD_SRC_LIVE;
  document.getElementById('ed-page-info').textContent = activePage;
  showActiveEditor();
}

function showActiveEditor() {
  const circuitEl = document.getElementById('circuit-editor');
  const boardEl = document.getElementById('board-editor');
  circuitEl.classList.toggle('hidden', activeEditorTab !== 'circuit');
  boardEl.classList.toggle('hidden', activeEditorTab !== 'board');
  document.querySelectorAll('.ed-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.ed === activeEditorTab);
  });
}

// Tab click
document.querySelector('.editor-tabs').addEventListener('click', e => {
  const tab = e.target.closest('[data-ed]');
  if (tab) {
    activeEditorTab = tab.dataset.ed;
    showActiveEditor();
  }
});

// Edit → twin sync: text → engine commands → visual updates
function onEditorChange(type) {
  const newText = document.getElementById(type === 'circuit' ? 'circuit-editor' : 'board-editor').value;
  
  // Diff text against engine state → produce commands
  const state = engine.getState();
  const commands = syncTextToEngine(type, newText, state);
  
  if (commands.length > 0) {
    // Execute the diff commands through the engine
    for (const cmd of commands) {
      engine.run(cmd);
    }
    cmdLog(`(${type} edit: ${commands.length} change${commands.length > 1 ? 's' : ''})`, true);
    
    // Re-sync: after engine processes commands, regenerate the OTHER file
    const newState = engine.getState();
    const texts = syncStateToText(newState);
    
    if (type === 'circuit') {
      // User edited circuit → regenerate board (don't touch circuit textarea)
      CIRCUIT_SRC_LIVE = newText;
      BOARD_SRC_LIVE = texts.board;
      document.getElementById('board-editor').value = BOARD_SRC_LIVE;
    } else {
      // User edited board → regenerate circuit (don't touch board textarea)
      BOARD_SRC_LIVE = newText;
      CIRCUIT_SRC_LIVE = texts.circuit;
      document.getElementById('circuit-editor').value = CIRCUIT_SRC_LIVE;
    }
    
    // Update file models
    circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT);
    boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD);
    circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 });
    boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 });
    
    // Re-render viewport
    renderViewport();
    renderPageTabs();
  } else {
    // No structural change — just update the live source
    if (type === 'circuit') CIRCUIT_SRC_LIVE = newText;
    else BOARD_SRC_LIVE = newText;
    circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT);
    boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD);
  }
  
  saveProject();
}

// Debounced change listener
let editTimer = null;
document.getElementById('circuit-editor').addEventListener('input', () => {
  clearTimeout(editTimer);
  editTimer = setTimeout(() => onEditorChange('circuit'), 400);
});
document.getElementById('board-editor').addEventListener('input', () => {
  clearTimeout(editTimer);
  editTimer = setTimeout(() => onEditorChange('board'), 400);
});

// Scroll editor to a line (for sync)
function scrollEditorToLine(type, lineNum) {
  const el = document.getElementById(type === 'circuit' ? 'circuit-editor' : 'board-editor');
  const lineHeight = 19.2; // approximate for 12px/1.6
  el.scrollTop = Math.max(0, (lineNum - 3) * lineHeight);
}

function renderEditor(editor, type) {
  // Now using textarea — this is kept for compatibility but not rendered as HTML
  return '';
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ============================================================================
// PAGE TABS
// ============================================================================
function renderPageTabs() {
  const pages = getPageNames(circuitFile);
  document.getElementById('page-tabs').innerHTML = pages.map(p =>
    `<div class="page-tab${p === activePage ? ' active' : ''}" data-page="${p}">${p}</div>`
  ).join('') + '<div class="page-tab page-tab-add">+</div>';
}

document.getElementById('page-tabs').addEventListener('click', e => {
  const page = e.target.dataset?.page;
  if (page && page !== activePage) {
    activePage = page;
    const result = syncToPage(circuitFile, boardFile, circuitEditor, boardEditor, page);
    circuitEditor = result.circuitEditor;
    boardEditor = result.boardEditor;
    renderEditors();
    renderPageTabs();
    renderViewport();
    cmdLog(`switch-page "${page}"`, true);
    saveProject();
  }
  // + button for new page
  if (e.target.classList.contains('page-tab-add')) {
    const name = prompt('New page name:');
    if (name && name.trim()) {
      const pageName = name.trim();
      runAndSave(`new-page "${pageName}" paper A4 landscape`);
      // Update file models
      CIRCUIT_SRC_LIVE += `\n@page ${pageName}\n`;
      BOARD_SRC_LIVE += `\n@page ${pageName}\npaper A4 landscape;\n`;
      circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT);
      boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD);
      circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 });
      boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 });
      activePage = pageName;
      renderEditors();
      renderPageTabs();
      renderViewport();
    }
  }
});

// ============================================================================
// VIEWPORT (SVG)
// ============================================================================
function renderViewport() {
  const svg = document.getElementById('svg');
  const rect = svg.getBoundingClientRect();
  const W = rect.width || 800, H = rect.height || 500;
  const state = engine.getState();
  const data = viewport.getRenderData(state, W, H);

  let html = `<rect width="${W}" height="${H}" fill="#f8f8f8"/>`;
  // Paper
  html += `<rect x="${data.paper.x}" y="${data.paper.y}" width="${data.paper.width}" height="${data.paper.height}" fill="#fff" stroke="#ddd"/>`;
  // Grid
  for (const l of data.grid.minor) html += `<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="#f0f0f0" stroke-width="0.5"/>`;
  for (const l of data.grid.major) html += `<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="#e8e8e8" stroke-width="0.5"/>`;

  // Devices
  const DW = 50, DH = 34;
  const devMap = {};
  for (const d of data.devices) {
    devMap[d.ref] = d;
    const rx = d.screenX - DW/2, ry = d.screenY - DH/2;
    const isSel = d.ref === selectedRef;
    html += `<g class="device" data-ref="${d.ref}" style="cursor:pointer">`;
    html += `<rect x="${rx}" y="${ry}" width="${DW}" height="${DH}" fill="${isSel ? '#c8e6c9' : '#e8f5e9'}" stroke="${isSel ? '#004D25' : '#007C3D'}" stroke-width="${isSel ? 2.5 : 1.5}" rx="3"/>`;
    if (isSel) html += `<rect x="${rx-3}" y="${ry-3}" width="${DW+6}" height="${DH+6}" fill="none" stroke="#007C3D" stroke-width="1" stroke-dasharray="4 2" rx="5"/>`;
    html += `<text x="${d.screenX}" y="${d.screenY+4}" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif" font-weight="600">${d.ref}</text>`;
    html += `</g>`;
  }

  // Routes
  for (const r of data.routes) {
    if (r.via.length > 0) {
      const fRef = r.from.split('.')[0], tRef = r.to.split('.')[0];
      const fd = devMap[fRef], td = devMap[tRef];
      let pts = [];
      if (fd) pts.push(`${fd.screenX},${fd.screenY}`);
      for (const v of r.via) pts.push(`${v.screenX},${v.screenY}`);
      if (td) pts.push(`${td.screenX},${td.screenY}`);
      html += `<polyline points="${pts.join(' ')}" fill="none" stroke="#1976D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  }

  // Connections (dashed, no route)
  for (const c of data.connections) {
    const fRef = c.from.split('.')[0], tRef = c.to.split('.')[0];
    const fd = devMap[fRef], td = devMap[tRef];
    if (fd && td && !data.routes.some(r => r.from === c.from && r.to === c.to)) {
      html += `<line x1="${fd.screenX}" y1="${fd.screenY}" x2="${td.screenX}" y2="${td.screenY}" stroke="#999" stroke-dasharray="4 3"/>`;
    }
  }

  // Labels
  for (const lb of data.labels) html += `<text x="${lb.screenX}" y="${lb.screenY}" font-size="11" fill="#555" font-family="sans-serif">${lb.text}</text>`;

  svg.innerHTML = html;
}

// Click device in viewport → select or connect based on active tool
document.getElementById('svg').addEventListener('mousedown', e => {
  const svgEl = document.getElementById('svg');
  const r = svgEl.getBoundingClientRect();
  const world = viewport.screenToWorld(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
  const device = e.target.closest('[data-ref]');
  const activeTool = toolSystem.getActive()?.id;

  // === CONNECT TOOL ===
  if (activeTool === 'connect') {
    if (device) {
      const ref = device.dataset.ref;
      const pinId = ref + '.OUT'; // simplified pin targeting
      if (!connectToolInst.isActive()) {
        // Start connection
        connectToolInst.clickPin(pinId);
        cmdLog(`connect: start from ${pinId}`, true);
      } else {
        // Complete connection
        const cmds = connectToolInst.clickPin(pinId);
        if (cmds) {
          cmds.forEach(c => {
            if (c.type === 'connect') runAndSave(`connect ${c.from} -> ${c.to}`);
            else if (c.type === 'route') {
              const via = c.via.map(p => `(${p.x}, ${p.y})`).join(' ');
              runAndSave(`route ${c.from} -> ${c.to} via ${via}`);
            }
          });
        }
        connectPreview = null;
        renderViewport();
      }
    } else if (connectToolInst.isActive()) {
      // Click on empty space = add turning point
      connectToolInst.clickPoint({ x: Math.round(world.x), y: Math.round(world.y) });
      cmdLog(`connect: point (${Math.round(world.x)}, ${Math.round(world.y)})`, true);
    }
    return;
  }

  // === SELECT TOOL (default) — click to select, start drag ===
  if (device) {
    const ref = device.dataset.ref;
    selectedRef = ref;

    // Start drag tracking
    dragState = {
      ref,
      startScreen: { x: e.clientX, y: e.clientY },
      startWorld: { x: world.x, y: world.y },
      moved: false,
    };

    // Sync editors
    const result = syncToDevice(circuitFile, boardFile, circuitEditor, boardEditor, ref);
    circuitEditor = result.circuitEditor;
    boardEditor = result.boardEditor;
    if (result.page && result.page !== activePage) {
      activePage = result.page;
      renderPageTabs();
    }
    // Switch to circuit tab and scroll to the device line
    activeEditorTab = 'circuit';
    showActiveEditor();
    const deviceLine = circuitEditor.highlight?.line ?? 0;
    scrollEditorToLine('circuit', deviceLine);
    document.getElementById('ed-page-info').textContent = activePage;
    renderViewport(); // re-render to show selection
    updateStatus();
  } else {
    // Click empty space → deselect
    selectedRef = null;
    renderViewport();
  }
});

// Drag: mousemove
document.getElementById('svg').addEventListener('mousemove', e => {
  const svgEl = document.getElementById('svg');
  const r = svgEl.getBoundingClientRect();
  const world = viewport.screenToWorld(e.clientX - r.left, e.clientY - r.top, r.width, r.height);

  // Update cursor position
  document.getElementById('st-pos').textContent = `x: ${world.x.toFixed(1)}  y: ${world.y.toFixed(1)} mm`;

  // Drag in progress?
  if (dragState && e.buttons === 1) {
    const dx = Math.abs(e.clientX - dragState.startScreen.x);
    const dy = Math.abs(e.clientY - dragState.startScreen.y);
    if (dx > 3 || dy > 3) dragState.moved = true;

    if (dragState.moved) {
      // Show ghost position via CSS transform (lightweight, no re-render)
      const device = document.querySelector(`[data-ref="${dragState.ref}"]`);
      if (device) {
        const sdx = e.clientX - dragState.startScreen.x;
        const sdy = e.clientY - dragState.startScreen.y;
        device.style.transform = `translate(${sdx}px, ${sdy}px)`;
        device.style.opacity = '0.6';
      }
    }
  }

  // Connect preview line
  if (connectToolInst.isActive()) {
    const preview = connectToolInst.getPreview();
    // We'll draw preview on next render — for now just track
    connectPreview = { ...preview, currentMouse: world };
  }
});

// Drag: mouseup → execute move command
document.addEventListener('mouseup', e => {
  if (dragState && dragState.moved) {
    const svgEl = document.getElementById('svg');
    const r = svgEl.getBoundingClientRect();
    const endWorld = viewport.screenToWorld(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
    const dx = Math.round(endWorld.x - dragState.startWorld.x);
    const dy = Math.round(endWorld.y - dragState.startWorld.y);

    if (dx !== 0 || dy !== 0) {
      // Get current position and compute new position
      const state = engine.getState();
      const placement = state.board?.placements?.[dragState.ref];
      if (placement) {
        const newX = placement.x + dx;
        const newY = placement.y + dy;
        runAndSave(`move ${dragState.ref} to (${newX}, ${newY})`);
      }
    }

    // Reset ghost style
    const device = document.querySelector(`[data-ref="${dragState.ref}"]`);
    if (device) { device.style.transform = ''; device.style.opacity = ''; }
    renderViewport();
  }
  dragState = null;
});

// ============================================================================
// COMMAND INPUT
// ============================================================================
document.getElementById('cmd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const text = e.target.value.trim();
    if (!text) return;
    e.target.value = '';
    runAndSave(text);
  }
});

function cmdLog(text, success = true) {
  const log = document.getElementById('cmd-log');
  // Show the command with >>> prompt
  const cmdDiv = document.createElement('div');
  cmdDiv.className = 'info';
  cmdDiv.textContent = `>>> ${text}`;
  log.appendChild(cmdDiv);
  // Show result
  const resDiv = document.createElement('div');
  resDiv.className = success ? 'ok' : 'err';
  resDiv.textContent = success ? 'OK' : 'Error: command failed';
  log.appendChild(resDiv);
  log.scrollTop = log.scrollHeight;
}

// ============================================================================
// KEYBOARD SHORTCUTS
// ============================================================================
document.addEventListener('keydown', e => {
  // Don't capture when typing in input
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  const key = e.key;

  // Delete selected device
  if ((key === 'Delete' || key === 'Backspace') && selectedRef) {
    runAndSave(`delete ${selectedRef}`);
    selectedRef = null;
    renderViewport();
    return;
  }

  // Rotate selected device
  if ((key === 'r' || key === 'R') && selectedRef) {
    runAndSave(`rotate ${selectedRef} 90`);
    return;
  }

  // Escape: cancel connect or deselect
  if (key === 'Escape') {
    if (connectToolInst.isActive()) {
      connectToolInst.escape();
      connectPreview = null;
      cmdLog('connect: cancelled', true);
      renderViewport();
    }
    selectedRef = null;
    toolSystem.dispatchShortcut('Escape');
    renderToolRail();
    renderViewport();
    updateStatus();
    return;
  }

  // Tool shortcuts
  const result = toolSystem.dispatchShortcut(key);
  if (result) {
    renderToolRail();
    updateStatus();
    return;
  }
});

// ============================================================================
// STATUS BAR
// ============================================================================
function updateStatus() {
  const active = toolSystem.getActive();
  document.getElementById('st-tool').textContent = active?.name || 'Select';
  const config = engine.getState().config;
  document.getElementById('st-paper').textContent = `${config.paper.size} ${config.paper.orientation === 'landscape' ? 'L' : 'P'}`;
}

// ============================================================================
// RESIZABLE SPLITTERS + COLLAPSE
// ============================================================================

// --- Horizontal splitter (viewport ↔ right panel width) ---
{
  const splitter = document.getElementById('splitter-h');
  const mainEl = document.querySelector('.main');
  const rightPanel = document.getElementById('right-panel');
  let startX, startWidth;

  splitter.addEventListener('mousedown', e => {
    e.preventDefault();
    startX = e.clientX;
    startWidth = rightPanel.offsetWidth;
    splitter.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';

    function onMove(ev) {
      const dx = startX - ev.clientX;
      const newWidth = Math.max(200, Math.min(800, startWidth + dx));
      mainEl.style.gridTemplateColumns = `44px 1fr 6px ${newWidth}px`;
      renderViewport();
    }
    function onUp() {
      splitter.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      renderViewport();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// --- Vertical splitter (editor ↔ terminal height) ---
{
  const splitter = document.getElementById('splitter-v');
  const editorPane = document.getElementById('editor-pane');
  const terminalPane = document.getElementById('terminal-pane');
  let startY, startEditorH, startTermH;

  splitter.addEventListener('mousedown', e => {
    e.preventDefault();
    startY = e.clientY;
    startEditorH = editorPane.offsetHeight;
    startTermH = terminalPane.offsetHeight;
    splitter.classList.add('active');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';

    function onMove(ev) {
      const dy = ev.clientY - startY;
      const newEditorH = Math.max(80, startEditorH + dy);
      const newTermH = Math.max(80, startTermH - dy);
      editorPane.style.flex = 'none';
      editorPane.style.height = newEditorH + 'px';
      terminalPane.style.height = newTermH + 'px';
    }
    function onUp() {
      splitter.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// --- Collapse/expand right panel ---
{
  const btn = document.getElementById('collapse-btn');
  const mainEl = document.querySelector('.main');
  let isCollapsed = false;

  btn.addEventListener('click', () => {
    isCollapsed = !isCollapsed;
    mainEl.classList.toggle('collapsed', isCollapsed);
    btn.textContent = isCollapsed ? '▶' : '◀';
    btn.title = isCollapsed ? 'Show panel (Ctrl+B)' : 'Hide panel (Ctrl+B)';
    setTimeout(renderViewport, 50);
  });

  // Ctrl+B shortcut
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'b' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      btn.click();
    }
  });
}

// ============================================================================
// INIT
// ============================================================================
viewport.zoomFit(800, 500);
renderToolRail();
renderEditors();
renderPageTabs();
renderViewport();
updateStatus();
cmdLog('(board loaded — 3 pages, 7 devices)', true);
cmdLog('Type commands below, or click devices in viewport', true);
window.addEventListener('resize', renderViewport);
</script>
