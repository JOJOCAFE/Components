<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components Board</title>
<!-- Run: python3 -m http.server 8080 -d board/
     Open: http://localhost:8080/app.html -->
<style>
:root {
  --bg: #1a1a1a; --bg2: #222; --bg3: #2a2a2a; --border: #333;
  --text: #eee; --text2: #aaa; --text3: #666;
  --green: #007C3D; --green2: #009948;
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: var(--sans); background: var(--bg); color: var(--text); }

/* Layout: menu | page-tabs + main | status */
.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; }

/* Menu bar */
.menu-bar { display: flex; align-items: center; padding: 2px 12px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 12px; gap: 0; }
.menu-bar .logo { color: var(--green); font-weight: 700; font-size: 14px; margin-right: 12px; }
.menu-bar > button, .menu-item > button { background: none; border: none; color: var(--text2); padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
.menu-bar > button:hover, .menu-item > button:hover { background: #333; color: var(--text); }
.menu-item { position: relative; }
.menu-item > button { position: relative; }

/* Dropdown */
.menu-dropdown { display: none; position: absolute; top: 100%; left: 0; min-width: 240px; background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); padding: 4px 0; z-index: 100; }
.menu-item.open .menu-dropdown { display: block; }
.menu-dropdown button { display: flex; align-items: center; width: 100%; padding: 6px 14px; border: none; background: none; color: var(--text); font-size: 12px; cursor: pointer; text-align: left; gap: 8px; }
.menu-dropdown button:hover { background: var(--green); color: #fff; }
.menu-dropdown .menu-key { margin-left: auto; color: var(--text3); font-size: 11px; font-family: var(--mono); }
.menu-dropdown button:hover .menu-key { color: rgba(255,255,255,0.7); }
.menu-sep { height: 1px; background: var(--border); margin: 4px 0; }
.menu-recent-label { padding: 4px 14px; font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
.menu-dropdown .recent-item { font-size: 11px; color: var(--text2); }
.menu-dropdown .recent-item:hover { color: #fff; }
.menu-dropdown .recent-empty { padding: 6px 14px; font-size: 11px; color: var(--text3); font-style: italic; }

/* Page tabs */
.page-tabs { display: flex; gap: 1px; padding: 0 8px; background: var(--bg2); border-bottom: 1px solid var(--border); align-items: end; }
.page-tab { padding: 5px 16px; font-size: 12px; color: var(--text2); cursor: pointer; border-radius: 4px 4px 0 0; background: var(--bg3); border: 1px solid var(--border); border-bottom: none; margin-bottom: -1px; }
.page-tab.active { background: var(--bg); color: var(--green); border-color: var(--border); }
.page-tab-add { background: none; border: 1px dashed var(--text3); color: var(--text3); }
.page-tab-add:hover { border-color: var(--green); color: var(--green); }

/* Main area: tool rail | viewport | splitter | right panel */
.main { display: grid; grid-template-columns: 44px 1fr 6px 360px; overflow: hidden; }
.main.collapsed { grid-template-columns: 44px 1fr 0px 0px; }
.main.collapsed .splitter-h, .main.collapsed .right-panel { display: none; }

/* Horizontal splitter (viewport ↔ right panel) */
.splitter-h { background: var(--border); cursor: col-resize; display: flex; align-items: center; justify-content: center; z-index: 5; user-select: none; }
.splitter-h:hover, .splitter-h.active { background: var(--green); }
.splitter-h::after { content: '⋮'; color: var(--text3); font-size: 14px; }
.splitter-h:hover::after, .splitter-h.active::after { color: #fff; }

/* Collapse/expand button on viewport top-right */
.collapse-btn { position: absolute; top: 8px; right: 8px; z-index: 10; width: 26px; height: 26px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.collapse-btn:hover { border-color: var(--green); color: var(--green); }

/* Tool rail */
.tool-rail { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 2px; }
.tool-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; background: none; color: var(--text2); border-radius: 4px; cursor: pointer; font-size: 14px; position: relative; }
.tool-btn:hover { background: #333; color: var(--text); }
.tool-btn.active { background: var(--green); color: #fff; }
.tool-btn .tip { display: none; position: absolute; left: 44px; background: #333; color: var(--text); padding: 4px 8px; border-radius: 3px; font-size: 11px; white-space: nowrap; z-index: 10; }
.tool-btn:hover .tip { display: block; }

/* Viewport */
.viewport { background: #f8f8f8; position: relative; overflow: hidden; }
.viewport svg { width: 100%; height: 100%; display: block; }

/* Device Library / Tray Panel */
.tray-panel { position: absolute; top: 0; left: 0; bottom: 0; width: 280px; background: var(--bg); border-right: 1px solid var(--border); display: none; flex-direction: column; z-index: 20; overflow: hidden; }
.tray-panel.open { display: flex; }
.tray-header { display: flex; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); gap: 8px; }
.tray-header .tray-title { font-size: 12px; font-weight: 600; color: var(--green); }
.tray-header .tray-close { margin-left: auto; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; }
.tray-header .tray-close:hover { color: var(--text); }
.tray-search { padding: 6px 12px; border-bottom: 1px solid var(--border); }
.tray-search input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; color: var(--text); font-size: 12px; outline: none; }
.tray-search input:focus { border-color: var(--green); }
.tray-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.tray-group { margin: 0; }
.tray-group-header { display: flex; align-items: center; padding: 4px 10px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--text2); gap: 4px; user-select: none; }
.tray-group-header:hover { background: var(--bg3); color: var(--text); }
.tray-group-header .arrow { font-size: 9px; color: var(--text3); transition: transform 0.15s; width: 12px; text-align: center; }
.tray-group-header.open .arrow { transform: rotate(90deg); }
.tray-group-header .gcount { margin-left: auto; font-size: 9px; color: var(--text3); font-weight: 400; }
.tray-group-items { display: none; padding-left: 16px; }
.tray-group.open .tray-group-items { display: block; }
.tray-item { display: flex; align-items: center; padding: 5px 12px; cursor: pointer; gap: 8px; border-left: 3px solid transparent; }
.tray-item:hover { background: var(--bg3); border-left-color: var(--green); }
.tray-item .ti-part { font-size: 11px; font-weight: 600; color: var(--text); font-family: var(--mono); min-width: 72px; }
.tray-item .ti-title { font-size: 10px; color: var(--text2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tray-item .ti-pins { font-size: 9px; color: var(--text3); }
.tray-item .ti-add { opacity: 0; background: var(--green); border: none; color: #fff; width: 18px; height: 18px; border-radius: 3px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.tray-item:hover .ti-add { opacity: 1; }
.tray-divider { padding: 6px 12px 3px; font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; border-top: 1px solid var(--border); margin-top: 4px; }
.tray-project { border-top: 1px solid var(--border); padding: 6px 12px; }
.tray-project-title { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.tray-project-item { display: flex; align-items: center; padding: 4px 0; gap: 8px; cursor: pointer; }
.tray-project-item:hover { color: var(--green); }
.tray-project-item .tp-ref { font-size: 10px; color: var(--green); font-family: var(--mono); min-width: 28px; }
.tray-project-item .tp-part { font-size: 11px; color: var(--text); }
.tray-project-item .tp-qty { margin-left: auto; font-size: 10px; color: var(--text3); }
.tray-project-item .tp-place { margin-left: 4px; background: var(--green2); border: none; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 9px; cursor: pointer; }
.tray-project-item .tp-place:hover { background: var(--green); }
.tray-empty { padding: 20px 12px; text-align: center; color: var(--text3); font-size: 11px; }
.tray-placing { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 4px 12px; border-radius: 4px; font-size: 11px; z-index: 30; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

/* Right panel: editor + vertical splitter + terminal */
.right-panel { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; min-width: 0; }

/* Vertical splitter (editor ↔ terminal) */
.splitter-v { height: 6px; background: var(--border); cursor: row-resize; display: flex; align-items: center; justify-content: center; flex-shrink: 0; user-select: none; }
.splitter-v:hover, .splitter-v.active { background: var(--green); }
.splitter-v::after { content: '···'; color: var(--text3); font-size: 10px; letter-spacing: 2px; }
.splitter-v:hover::after, .splitter-v.active::after { color: #fff; }

.editor-pane { display: flex; flex-direction: column; overflow: hidden; flex: 1; min-height: 80px; }
.terminal-pane { display: flex; flex-direction: column; overflow: hidden; min-height: 80px; height: 240px; }
.editor-tabs { display: flex; align-items: center; padding: 0; background: var(--bg2); border-bottom: 1px solid var(--border); }
.ed-tab { padding: 6px 14px; font-size: 11px; color: var(--text2); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; font-family: var(--sans); }
.ed-tab:hover { color: var(--text); }
.ed-tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }
.ed-tab-info { margin-left: auto; padding-right: 10px; font-size: 10px; color: var(--text3); }
.editor-body { flex: 1; overflow-y: auto; font: 12px/1.6 var(--mono); padding: 4px 0; }
.editor-body.hidden { display: none; }
.editor-textarea { flex: 1; resize: none; border: none; outline: none; background: #1e1e1e; color: #ccc; font: 12px/1.6 var(--mono); padding: 8px 12px; tab-size: 2; }
.editor-textarea.hidden { display: none; }
.editor-textarea:focus { background: #1f1f1f; }
.ed-line { display: flex; padding: 0 8px; }
.ed-line:hover { background: #252525; }
.ed-line.hl { background: #1a3a1a; border-left: 3px solid var(--green); }
.ed-ln { color: var(--text3); min-width: 28px; text-align: right; padding-right: 10px; user-select: none; }
.ed-code { color: #ccc; white-space: pre; }
.ed-code .kw { color: #569CD6; } .ed-code .ref { color: #DCDCAA; }
.ed-code .str { color: #CE9178; } .ed-code .pg { color: #C586C0; font-weight: bold; }
.ed-code .num { color: #B5CEA8; } .ed-code .cmt { color: #6A9955; }

/* Terminal (Python IDLE style) */
.terminal-pane { display: flex; flex-direction: column; overflow: hidden; background: #fffff8; border-top: 1px solid var(--border); }
.terminal-header { display: flex; align-items: center; padding: 3px 10px; background: #e8e8e0; border-bottom: 1px solid #ccc; }
.terminal-title { font: bold 11px var(--sans); color: #333; }
.terminal-ver { margin-left: auto; font-size: 10px; color: #888; }
.terminal-body { flex: 1; overflow-y: auto; padding: 6px 10px; font: 12px/1.5 var(--mono); color: #333; }
.terminal-body .term-banner { color: #666; }
.terminal-body .ok { color: #006400; }
.terminal-body .err { color: #8b0000; }
.terminal-body .info { color: #555; }
.terminal-body .result { color: #00008b; }
.terminal-input-row { display: flex; align-items: center; padding: 4px 10px; background: #fffff8; border-top: 1px solid #ddd; }
.terminal-prompt { color: #006400; font: bold 12px var(--mono); margin-right: 6px; }
.terminal-input { flex: 1; background: transparent; border: none; color: #333; font: 12px var(--mono); outline: none; }

/* Status bar */
.status-bar { display: flex; align-items: center; padding: 3px 12px; background: var(--bg2); border-top: 1px solid var(--border); font-size: 11px; color: var(--text2); gap: 16px; }
.status-bar .active-tool { color: var(--green); font-weight: 600; }
</style>
</head>
<body>
<div class="app">

  <!-- Menu bar -->
  <div class="menu-bar">
    <span class="logo">C</span>
    <div class="menu-item" id="menu-file">
      <button>File</button>
      <div class="menu-dropdown" id="dropdown-file">
        <button data-action="new"><span class="menu-key">Ctrl+N</span>New Project</button>
        <button data-action="open"><span class="menu-key">Ctrl+O</span>Open…</button>
        <div class="menu-sep"></div>
        <button data-action="save"><span class="menu-key">Ctrl+S</span>Save</button>
        <button data-action="save-as"><span class="menu-key">Ctrl+Shift+S</span>Save As…</button>
        <div class="menu-sep"></div>
        <button data-action="download-circuit">Download Components:circuit</button>
        <button data-action="download-board">Download Components:board</button>
        <div class="menu-sep"></div>
        <div class="menu-recent-label">Recent Projects</div>
        <div id="recent-list"></div>
      </div>
    </div>
    <button>Edit</button><button>View</button>
    <button>Project</button><button>Simulate</button><button>Help</button>
  </div>

  <!-- Page tabs -->
  <div class="page-tabs" id="page-tabs">
    <div class="page-tab active" data-page="CPU">CPU</div>
    <div class="page-tab" data-page="Memory">Memory</div>
    <div class="page-tab" data-page="ALU">ALU</div>
    <div class="page-tab page-tab-add">+</div>
  </div>

  <!-- Main area -->
  <div class="main">
    <!-- Tool rail -->
    <div class="tool-rail" id="tool-rail"></div>

    <!-- Viewport -->
    <div class="viewport" id="viewport">
      <svg id="svg"></svg>
      <button class="collapse-btn" id="collapse-btn" title="Toggle panel (Ctrl+B)">◀</button>
      <!-- Device Library / Project Tray Panel -->
      <div class="tray-panel" id="tray-panel">
        <div class="tray-header">
          <span class="tray-title">Device Library</span>
          <button class="tray-close" id="tray-close">×</button>
        </div>
        <div class="tray-search">
          <input type="text" id="tray-search" placeholder="Search… (counter, NAND, 574)">
        </div>
        <!-- Tree-style library browser -->
        <div class="tray-list" id="tray-list"></div>
        <!-- Catalog load status -->
        <div id="tray-status" style="font-size:9px;color:var(--text3);padding:2px 8px;"></div>
        <!-- Project tray (selected parts) -->
        <div class="tray-project" id="tray-project">
          <div class="tray-project-title">⬒ Project Tray</div>
          <div id="tray-project-list"></div>
        </div>
      </div>
      <!-- Placement indicator -->
      <div class="tray-placing" id="tray-placing" style="display:none"></div>
    </div>

    <!-- Horizontal splitter (drag to resize viewport ↔ right panel) -->
    <div class="splitter-h" id="splitter-h"></div>

    <!-- Right panel: tabbed editor + vertical splitter + terminal -->
    <div class="right-panel" id="right-panel">
      <!-- Editor tabs -->
      <div class="editor-pane" id="editor-pane">
        <div class="editor-tabs">
          <button class="ed-tab active" data-ed="circuit">Components:circuit</button>
          <button class="ed-tab" data-ed="board">Components:board</button>
          <span class="ed-tab-info" id="ed-page-info">CPU</span>
        </div>
        <textarea class="editor-textarea" id="circuit-editor" spellcheck="false" wrap="off"></textarea>
        <textarea class="editor-textarea hidden" id="board-editor" spellcheck="false" wrap="off"></textarea>
      </div>
      <!-- Vertical splitter (drag to resize editor ↔ terminal) -->
      <div class="splitter-v" id="splitter-v"></div>
      <!-- Terminal (Python IDLE style) -->
      <div class="terminal-pane" id="terminal-pane">
        <div class="terminal-header">
          <span class="terminal-title">Components Shell</span>
          <span class="terminal-ver">v1.0</span>
        </div>
        <div class="terminal-body" id="cmd-log">
          <div class="term-banner">Components Board Engine — 1046 tests verified</div>
          <div class="term-banner">Type commands, or use tools in the viewport.</div>
          <div class="term-banner">───────────────────────────────────────────</div>
        </div>
        <div class="terminal-input-row">
          <span class="terminal-prompt">&gt;&gt;&gt;</span>
          <input class="terminal-input" id="cmd-input" placeholder="" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span class="active-tool" id="st-tool">Select</span>
    <span id="st-pos">x: 0.0  y: 0.0 mm</span>
    <span id="st-zoom">100%</span>
    <span id="st-paper">A4 Landscape</span>
    <span style="margin-left:auto" id="st-save"></span>
    <span id="st-tests">1046 tests ✓</span>

<script type="module">
// ============================================================================
// IMPORTS — all from our engine modules (Phases 1-5)
// ============================================================================
import { parseCommand } from './src/controller/parser.js';
import { createExecutor } from './src/controller/executor.js';
import { createEngine } from './src/controller/engine.js';
import { createViewport } from './src/view/viewport.js';
import { createStatusBar } from './src/view/status-bar.js';
import { createPageTabs } from './src/view/page-tabs.js';
import { parseFile, FILE_TYPES, LINE_TYPES, getPageNames, serializeDevice, serializeConnect, serializePaper, serializePlace, serializeRoute, serializeLabel } from './src/model/file.js';
import { createEditor, highlightAndScroll, getText, getLineCount } from './src/view/editor.js';
import { syncToPage, syncToDevice, getCurrentPage } from './src/controller/sync.js';
import { createToolSystem } from './src/controller/tools.js';
import { createSelectTool } from './src/controller/select-tool.js';
import { createConnectTool } from './src/controller/connect-tool.js';

// ==========================================================================
// STATE → TEXT helpers (replaced deprecated twin-sync.js)
// Board is allowed to serialize its own display text from state it holds.
// ==========================================================================

function syncStateToText(engineState) {
  return {
    circuit: _stateToCircuit(engineState),
    board: _stateToBoard(engineState),
  };
}

function _stateToCircuit(engineState) {
  const pageList = engineState.pages?.list || ['Page 1'];
  const devices = engineState.component?.devices || {};
  const connections = engineState.component?.connections || [];
  const lines = [];
  for (const pageName of pageList) {
    lines.push(`@page ${pageName}`);
    for (const [ref, dev] of Object.entries(devices)) {
      if ((dev.page || pageList[0]) === pageName) {
        lines.push(serializeDevice(ref, dev.part));
      }
    }
    for (const conn of connections) {
      const fromRef = conn.from.split('.')[0];
      const fromDev = devices[fromRef];
      if ((fromDev?.page || pageList[0]) === pageName) {
        lines.push(serializeConnect(conn.from, conn.to));
      }
    }
    lines.push('');
  }
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

function _stateToBoard(engineState) {
  const pageList = engineState.pages?.list || ['Page 1'];
  const placements = engineState.board?.placements || {};
  const routes = engineState.board?.routes || [];
  const labels = engineState.board?.labels || [];
  const config = engineState.config;
  const lines = [];
  for (const pageName of pageList) {
    lines.push(`@page ${pageName}`);
    const paperSize = config?.paper?.size || 'A4';
    const paperOrient = config?.paper?.orientation || 'landscape';
    lines.push(serializePaper(paperSize, paperOrient));
    for (const [ref, pl] of Object.entries(placements)) {
      if ((pl.page || pageList[0]) === pageName) {
        lines.push(serializePlace(ref, pl.x, pl.y, pl.rotation || 0));
      }
    }
    for (const route of routes) {
      const fromRef = route.from.split('.')[0];
      const fromPl = placements[fromRef];
      if ((fromPl?.page || pageList[0]) === pageName) {
        lines.push(serializeRoute(route.from, route.to, route.via || []));
      }
    }
    for (const label of labels) {
      if ((label.page || pageList[0]) === pageName) {
        lines.push(serializeLabel(label.text, label.x, label.y));
      }
    }
    lines.push('');
  }
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

function syncTextToEngine(editedSide, newText, engineState) {
  if (editedSide === 'circuit') {
    return _circuitTextToCommands(newText, engineState);
  }
  return _boardTextToCommands(newText, engineState);
}

function _circuitTextToCommands(newText, engineState) {
  const file = parseFile(newText, FILE_TYPES.CIRCUIT);
  const currentDevices = engineState.component?.devices || {};
  const currentConnections = engineState.component?.connections || [];
  const commands = [];
  const parsedDevices = {};
  const parsedConnections = [];
  for (const page of file.pages) {
    for (const line of page.lines) {
      if (line.parsed.type === LINE_TYPES.DEVICE) {
        parsedDevices[line.parsed.ref] = { part: line.parsed.part, page: page.name };
      }
      if (line.parsed.type === LINE_TYPES.CONNECT) {
        parsedConnections.push({ from: line.parsed.from, to: line.parsed.to });
      }
    }
  }
  for (const [ref, dev] of Object.entries(parsedDevices)) {
    if (!currentDevices[ref]) {
      commands.push(`place ${ref}, ${dev.part} at (50, 50) rotate 0`);
    }
  }
  for (const ref of Object.keys(currentDevices)) {
    if (!parsedDevices[ref]) {
      commands.push(`delete ${ref}`);
    }
  }
  for (const conn of parsedConnections) {
    const exists = currentConnections.some(c => c.from === conn.from && c.to === conn.to);
    if (!exists) {
      commands.push(`connect ${conn.from} -> ${conn.to}`);
    }
  }
  for (const conn of currentConnections) {
    const exists = parsedConnections.some(c => c.from === conn.from && c.to === conn.to);
    if (!exists) {
      commands.push(`disconnect ${conn.from} -> ${conn.to}`);
    }
  }
  return commands;
}

function _boardTextToCommands(newText, engineState) {
  const file = parseFile(newText, FILE_TYPES.BOARD);
  const currentPlacements = engineState.board?.placements || {};
  const commands = [];
  const parsedPlacements = {};
  for (const page of file.pages) {
    for (const line of page.lines) {
      if (line.parsed.type === LINE_TYPES.PLACE) {
        parsedPlacements[line.parsed.ref] = {
          x: line.parsed.x, y: line.parsed.y,
          rotation: line.parsed.rotation, page: page.name,
        };
      }
    }
  }
  for (const [ref, pl] of Object.entries(parsedPlacements)) {
    const current = currentPlacements[ref];
    if (current) {
      if (current.x !== pl.x || current.y !== pl.y) {
        commands.push(`move ${ref} to (${pl.x}, ${pl.y})`);
      }
      if ((current.rotation || 0) !== pl.rotation) {
        commands.push(`rotate ${ref} ${pl.rotation}`);
      }
    }
  }
  return commands;
}

function saveProject() {
  // Auto-save current working state (separate from named projects)
  const data = { circuit: CIRCUIT_SRC_LIVE, board: BOARD_SRC_LIVE, commands: engine.getLog?.() || [], activePage, projectName: currentProjectName };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { /* quota exceeded, ignore */ }
}

function loadProject() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.circuit) CIRCUIT_SRC_LIVE = data.circuit;
    if (data.board) BOARD_SRC_LIVE = data.board;
    if (data.activePage) activePage = data.activePage;
    if (data.projectName) currentProjectName = data.projectName;
    circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT);
    boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD);
    circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 });
    boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 });
    if (data.commands?.length) {
      data.commands.forEach(cmd => engine.run(cmd));
      return true;
    }
  } catch(e) { /* corrupt, ignore */ }
  return false;
}

/** Cache: Map<slug, { viewBox, inner }> — preloaded SVG content */
const deviceSVGCache = new Map();

/** List of available chip frame SVGs (from assets/) */
const CHIP_FRAME_SLUGS = [
  '74hc00','74hc02','74hc03','74hc04','74hc05','74hc07','74hc08','74hc10','74hc11',
  '74hc132','74hc138','74hc139','74hc14','74hc147','74hc148','74hc151','74hc153',
  '74hc154','74hc155','74hc158','74hc160','74hc162','74hc163','74hc164','74hc165',
  '74hc166','74hc193','74hc20','74hc21','74hc238','74hc240','74hc244','74hc251',
  '74hc257','74hc266','74hc27','74hc273','74hc283','74hc30','74hc32','74hc352',
  '74hc374','74hc377','74hc4049','74hc4050','74hc4078','74hc4520','74hc4538',
  '74hc541','74hc593','74hc595','74hc688','74hc74','74hc85','74hc86','74hc922',
  '74hct04','74hct14','74hct245','74hct541','74hct574',
];

/**
 * Preload SVG assets into cache (async, non-blocking).
 * Only fetches first batch to keep startup fast.
 */
async function preloadSVGAssets() {
  const BATCH = 15; // load first 15 immediately, rest lazy
  const toLoad = CHIP_FRAME_SLUGS.slice(0, BATCH);
  
  await Promise.all(toLoad.map(async slug => {
    try {
      const resp = await fetch(`assets/74hc-chip-frames-no-pins/${slug}.svg`);
      if (!resp.ok) return;
      const text = await resp.text();
      parseSVGIntoCache(slug, text);
    } catch(e) { /* network error, skip */ }
  }));
  
  renderViewport(); // re-render with loaded assets
  
  // Lazy-load the rest
  for (const slug of CHIP_FRAME_SLUGS.slice(BATCH)) {
    if (deviceSVGCache.has(slug)) continue;
    try {
      const resp = await fetch(`assets/74hc-chip-frames-no-pins/${slug}.svg`);
      if (resp.ok) parseSVGIntoCache(slug, await resp.text());
    } catch(e) { /* skip */ }
  }
}

/**
 * Parse an SVG string and store viewBox + inner content.
 */
function parseSVGIntoCache(slug, svgText) {
  const vbMatch = svgText.match(/viewBox="([^"]+)"/);
  if (!vbMatch) return;
  // Extract inner content (between <svg...> and </svg>)
  const innerMatch = svgText.match(/<svg[^>]*>([\s\S]*)<\/svg>/i);
  if (!innerMatch) return;
  deviceSVGCache.set(slug, {
    viewBox: vbMatch[1],
    inner: innerMatch[1],
  });
}

/**
 * Get device dimensions (mm) based on part info.
 * ICs scale with pin count, passives are small.
 */
function getDeviceDimensions(part) {
  const p = (part || '').toLowerCase();
  // Virtual parts — small
  if (p === 'vcc' || p === 'gnd') return { w: 16, h: 16, pins: 1 };
  if (p === 'probe' || p === 'clocksource' || p === 'inputsource') return { w: 20, h: 20, pins: 1 };
  // Passives — small
  if (p.includes('resistor') || p.includes('capacitor') || p.includes('crystal')) return { w: 20, h: 10, pins: 2 };
  if (p.includes('led')) return { w: 14, h: 14, pins: 2 };
  // ICs — scale by pin count from catalog
  const entry = library.getByPart(part);
  const pins = entry?.pinCount || 14;
  // DIP: width proportional, height grows with pins
  const h = 14 + (pins / 2) * 4; // ~30 for 14pin, ~38 for 20pin
  const w = 24 + (pins > 16 ? 8 : 0); // wider for 20+ pin
  return { w, h, pins };
}

/**
 * Get colors for a device type.
 */
function getDeviceColors(part) {
  const p = (part || '').toLowerCase();
  if (p === 'vcc' || p === 'gnd') return { fill: '#ffecb3', stroke: '#f57c00', selFill: '#fff3e0', selStroke: '#e65100' };
  if (p.includes('probe') || p.includes('clock') || p.includes('input')) return { fill: '#e3f2fd', stroke: '#1565c0', selFill: '#bbdefb', selStroke: '#0d47a1' };
  if (p.includes('led')) return { fill: '#fce4ec', stroke: '#c62828', selFill: '#ffcdd2', selStroke: '#b71c1c' };
  if (p.includes('resistor') || p.includes('capacitor')) return { fill: '#f3e5f5', stroke: '#6a1b9a', selFill: '#e1bee7', selStroke: '#4a148c' };
  // Default IC colors
  return { fill: '#e8f5e9', stroke: '#007C3D', selFill: '#c8e6c9', selStroke: '#004D25' };
}

/**
 * Short display name for a part.
 */
function partShortName(part) {
  if (!part) return '';
  // Remove "digital." or "memory." prefix if present
  const clean = part.replace(/^(digital|memory|passive|support|virtual)\./, '');
  // Truncate if too long
  return clean.length > 12 ? clean.slice(0, 11) + '…' : clean;
}

function renderViewport() {
  const svg = document.getElementById('svg');
  const rect = svg.getBoundingClientRect();
  const W = rect.width || 800, H = rect.height || 500;
  const state = engine.getState();
  const data = viewport.getRenderData(state, W, H);

  let html = `<rect width="${W}" height="${H}" fill="#f8f8f8"/>`;
  // Paper
  html += `<rect x="${data.paper.x}" y="${data.paper.y}" width="${data.paper.width}" height="${data.paper.height}" fill="#fff" stroke="#ddd"/>`;
  // Grid
  for (const l of data.grid.minor) html += `<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="#f0f0f0" stroke-width="0.5"/>`;
  for (const l of data.grid.major) html += `<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="#e8e8e8" stroke-width="0.5"/>`;

  // Devices — render with SVG assets or generic DIP frame
  const devMap = {};
  for (const d of data.devices) {
    devMap[d.ref] = d;
    const isSel = d.ref === selectedRef;
    const part = d.part || '';
    const dims = getDeviceDimensions(part);
    const DW = dims.w, DH = dims.h;
    const rx = d.screenX - DW/2, ry = d.screenY - DH/2;

    html += `<g class="device" data-ref="${d.ref}" style="cursor:pointer">`;

    // Selection highlight
    if (isSel) html += `<rect x="${rx-3}" y="${ry-3}" width="${DW+6}" height="${DH+6}" fill="none" stroke="#007C3D" stroke-width="1" stroke-dasharray="4 2" rx="5"/>`;

    // Check if we have a cached SVG asset for this part
    const slug = part.toLowerCase().replace(/^(digital|memory|passive|support|virtual)\./, '').replace(/[^a-z0-9]/g, '');
    const svgContent = deviceSVGCache.get(slug);
    if (svgContent) {
      // Render SVG asset inline, scaled to fit
      html += `<svg x="${rx}" y="${ry}" width="${DW}" height="${DH}" viewBox="${svgContent.viewBox}" preserveAspectRatio="xMidYMid meet">${svgContent.inner}</svg>`;
    } else {
      // Generic DIP frame (colored by type)
      const colors = getDeviceColors(part);
      html += `<rect x="${rx}" y="${ry}" width="${DW}" height="${DH}" fill="${isSel ? colors.selFill : colors.fill}" stroke="${isSel ? colors.selStroke : colors.stroke}" stroke-width="${isSel ? 2 : 1.5}" rx="3"/>`;
      // Notch for ICs
      if (dims.pins >= 8) {
        html += `<path d="M${d.screenX-4} ${ry} a4 4 0 0 0 8 0" fill="none" stroke="${colors.stroke}" stroke-width="1"/>`;
      }
      // Pin dots (left and right)
      const pinsPerSide = Math.ceil(dims.pins / 2);
      if (pinsPerSide > 0 && dims.pins >= 4) {
        const pinSpacing = (DH - 6) / pinsPerSide;
        for (let i = 0; i < pinsPerSide; i++) {
          const py = ry + 3 + pinSpacing * (i + 0.5);
          html += `<circle cx="${rx+3}" cy="${py}" r="1.5" fill="${colors.stroke}" opacity="0.5"/>`;
          html += `<circle cx="${rx+DW-3}" cy="${py}" r="1.5" fill="${colors.stroke}" opacity="0.5"/>`;
        }
      }
    }

    // Ref label (always on top)
    html += `<text x="${d.screenX}" y="${ry - 4}" text-anchor="middle" font-size="9" fill="#333" font-family="sans-serif" font-weight="600">${d.ref}</text>`;
    // Part label (below device)
    html += `<text x="${d.screenX}" y="${ry + DH + 10}" text-anchor="middle" font-size="8" fill="#666" font-family="sans-serif">${partShortName(part)}</text>`;
    html += `</g>`;
  }

  // Routes
  for (const r of data.routes) {
    if (r.via.length > 0) {
      const fRef = r.from.split('.')[0], tRef = r.to.split('.')[0];
      const fd = devMap[fRef], td = devMap[tRef];
      let pts = [];
      if (fd) pts.push(`${fd.screenX},${fd.screenY}`);
      for (const v of r.via) pts.push(`${v.screenX},${v.screenY}`);
      if (td) pts.push(`${td.screenX},${td.screenY}`);
      html += `<polyline points="${pts.join(' ')}" fill="none" stroke="#1976D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  }

  // Connections (dashed, no route)
  for (const c of data.connections) {
    const fRef = c.from.split('.')[0], tRef = c.to.split('.')[0];
    const fd = devMap[fRef], td = devMap[tRef];
    if (fd && td && !data.routes.some(r => r.from === c.from && r.to === c.to)) {
      html += `<line x1="${fd.screenX}" y1="${fd.screenY}" x2="${td.screenX}" y2="${td.screenY}" stroke="#999" stroke-dasharray="4 3"/>`;
    }
  }

  // Labels
  for (const lb of data.labels) html += `<text x="${lb.screenX}" y="${lb.screenY}" font-size="11" fill="#555" font-family="sans-serif">${lb.text}</text>`;

  svg.innerHTML = html;
}

// Click device in viewport → select or connect based on active tool
document.getElementById('svg').addEventListener('mousedown', e => {
  // If panning (shift+click or middle button), don't select/connect
  if (e.shiftKey || e.button === 1) return;
  // If placing from tray, let the click handler handle it
  if (placingPart) return;

  const svgEl = document.getElementById('svg');
  const r = svgEl.getBoundingClientRect();
  const world = viewport.screenToWorld(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
  const device = e.target.closest('[data-ref]');
  const activeTool = toolSystem.getActive()?.id;

  // === CONNECT TOOL ===
  if (activeTool === 'connect') {
    if (device) {
      const ref = device.dataset.ref;
      const pinId = ref + '.OUT'; // simplified pin targeting
      if (!connectToolInst.isActive()) {
        // Start connection
        connectToolInst.clickPin(pinId);
        cmdLog(`connect: start from ${pinId}`, true);
      } else {
        // Complete connection
        const cmds = connectToolInst.clickPin(pinId);
        if (cmds) {
          cmds.forEach(c => {
            if (c.type === 'connect') runAndSave(`connect ${c.from} -> ${c.to}`);
            else if (c.type === 'route') {
              const via = c.via.map(p => `(${p.x}, ${p.y})`).join(' ');
              runAndSave(`route ${c.from} -> ${c.to} via ${via}`);
            }
          });
        }
        connectPreview = null;
        renderViewport();
      }
    } else if (connectToolInst.isActive()) {
      // Click on empty space = add turning point
      connectToolInst.clickPoint({ x: Math.round(world.x), y: Math.round(world.y) });
      cmdLog(`connect: point (${Math.round(world.x)}, ${Math.round(world.y)})`, true);
    }
    return;
  }

  // === SELECT TOOL (default) — click to select, start drag ===
  if (device) {
    const ref = device.dataset.ref;
    selectedRef = ref;

    // Start drag tracking
    dragState = {
      ref,
      startScreen: { x: e.clientX, y: e.clientY },
      startWorld: { x: world.x, y: world.y },
      moved: false,
    };

    // Sync editors
    const result = syncToDevice(circuitFile, boardFile, circuitEditor, boardEditor, ref);
    circuitEditor = result.circuitEditor;
    boardEditor = result.boardEditor;
    if (result.page && result.page !== activePage) {
      activePage = result.page;
      renderPageTabs();
    }
    // Switch to circuit tab and scroll to the device line
    activeEditorTab = 'circuit';
    showActiveEditor();
    const deviceLine = circuitEditor.highlight?.line ?? 0;
    scrollEditorToLine('circuit', deviceLine);
    document.getElementById('ed-page-info').textContent = activePage;
    renderViewport(); // re-render to show selection
    updateStatus();
  } else {
    // Click empty space → deselect
    selectedRef = null;
    renderViewport();
  }
});

// Drag: mousemove
document.getElementById('svg').addEventListener('mousemove', e => {
  const svgEl = document.getElementById('svg');
  const r = svgEl.getBoundingClientRect();
  const world = viewport.screenToWorld(e.clientX - r.left, e.clientY - r.top, r.width, r.height);

  // Update cursor position
  document.getElementById('st-pos').textContent = `x: ${world.x.toFixed(1)}  y: ${world.y.toFixed(1)} mm`;

  // Drag in progress?
  if (dragState && e.buttons === 1) {
    const dx = Math.abs(e.clientX - dragState.startScreen.x);
    const dy = Math.abs(e.clientY - dragState.startScreen.y);
    if (dx > 3 || dy > 3) dragState.moved = true;

    if (dragState.moved) {
      // Show ghost position via CSS transform (lightweight, no re-render)
      const device = document.querySelector(`[data-ref="${dragState.ref}"]`);
      if (device) {
        const sdx = e.clientX - dragState.startScreen.x;
        const sdy = e.clientY - dragState.startScreen.y;
        device.style.transform = `translate(${sdx}px, ${sdy}px)`;
        device.style.opacity = '0.6';
      }
    }
  }

  // Connect preview line
  if (connectToolInst.isActive()) {
    const preview = connectToolInst.getPreview();
    // We'll draw preview on next render — for now just track
    connectPreview = { ...preview, currentMouse: world };
  }
});

// Drag: mouseup → execute move command
document.addEventListener('mouseup', e => {
  if (dragState && dragState.moved) {
    const svgEl = document.getElementById('svg');
    const r = svgEl.getBoundingClientRect();
    const endWorld = viewport.screenToWorld(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
    const dx = Math.round(endWorld.x - dragState.startWorld.x);
    const dy = Math.round(endWorld.y - dragState.startWorld.y);

    if (dx !== 0 || dy !== 0) {
      // Get current position and compute new position
      const state = engine.getState();
      const placement = state.board?.placements?.[dragState.ref];
      if (placement) {
        const newX = placement.x + dx;
        const newY = placement.y + dy;
        runAndSave(`move ${dragState.ref} to (${newX}, ${newY})`);
      }
    }

    // Reset ghost style
    const device = document.querySelector(`[data-ref="${dragState.ref}"]`);
    if (device) { device.style.transform = ''; device.style.opacity = ''; }
    renderViewport();
  }
  dragState = null;
});

// ============================================================================
// ZOOM + PAN (scroll-to-zoom, shift/middle-drag-to-pan)
// ============================================================================

// Scroll wheel → pointer-anchored zoom
document.getElementById('svg').addEventListener('wheel', e => {
  e.preventDefault();
  const svgEl = document.getElementById('svg');
  const r = svgEl.getBoundingClientRect();
  const factor = e.deltaY > 0 ? 0.9 : 1.1; // scroll down = zoom out
  viewport.zoomAtPoint(factor, e.clientX - r.left, e.clientY - r.top, r.width, r.height);
  renderViewport();
  updateStatus();
}, { passive: false });

// Shift+drag or middle-button drag → pan
let panState = null;

document.getElementById('svg').addEventListener('mousedown', e => {
  // Shift+left or middle button starts pan
  if (e.shiftKey || e.button === 1) {
    e.preventDefault();
    panState = { startX: e.clientX, startY: e.clientY };
  }
}, true); // capture phase so it fires before select/connect handlers

document.addEventListener('mousemove', e => {
  if (panState && (e.buttons & 5)) { // left(1) or middle(4) held
    const dx = e.clientX - panState.startX;
    const dy = e.clientY - panState.startY;
    if (dx !== 0 || dy !== 0) {
      viewport.panByScreenDelta(dx, dy);
      panState.startX = e.clientX;
      panState.startY = e.clientY;
      renderViewport();
      updateStatus();
    }
  }
});

document.addEventListener('mouseup', e => {
  if (panState) {
    panState = null;
  }
});

// ============================================================================
// COMMAND INPUT (progressive: short aliases + dot-notation)
// ============================================================================
document.getElementById('cmd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const text = e.target.value.trim();
    if (!text) return;
    e.target.value = '';
    executeCommand(text);
  }
  // Tab completion hint
  if (e.key === 'Tab') {
    e.preventDefault();
    const text = e.target.value.trim();
    const hint = getCompletionHint(text);
    if (hint) e.target.value = hint;
  }
});

// ============================================================================
// COMMAND REGISTRY SETUP
// ============================================================================
const registry = createCommandRegistry();

// --- Helpers ---
function unquote(s) { return s.replace(/^["']|["']$/g, '').trim(); }
function quoteIfNeeded(s) { return s.includes(' ') && !s.startsWith('"') ? `"${s}"` : s; }
function doSaveAs(name) { currentProjectName = name; saveToProjects(name); updateTitle(); addToRecent(name); cmdLog(`Saved as "${name}"`, true); }
function doSwitchPage(name) {
  if (!name) return;
  activePage = name;
  const result = syncToPage(circuitFile, boardFile, circuitEditor, boardEditor, name);
  circuitEditor = result.circuitEditor; boardEditor = result.boardEditor;
  renderEditors(); renderPageTabs(); renderViewport();
  cmdLog(`Page: ${name}`, true);
}
function doCollapse(collapse) {
  const mainEl = document.querySelector('.main');
  const btn = document.getElementById('collapse-btn');
  const isCollapsed = mainEl.classList.contains('collapsed');
  if (collapse && !isCollapsed || !collapse && isCollapsed) btn.click();
}

// Register file commands
registry.register(createFileCommands({
  onNew: () => fileNew(),
  onOpen: (name) => name ? fileOpenProject(name) : fileOpen(),
  onSave: () => fileSave(),
  onSaveAs: (name) => name ? doSaveAs(name) : fileSaveAs(),
  onDownload: (type) => fileDownload(type),
  onRecent: () => getRecentList(),
}));

// Register edit commands
registry.register(createEditCommands({
  onUndo: () => runAndSave('undo'),
  onRedo: () => runAndSave('redo'),
  onSelect: (ref) => { if (ref) { selectedRef = ref; renderViewport(); } },
  onDeselect: () => { selectedRef = null; renderViewport(); },
}));

// Register view commands
registry.register(createViewCommands({
  onCollapse: () => doCollapse(true),
  onExpand: () => doCollapse(false),
  onZoom: (args) => cmdLog('zoom: not yet implemented', true),
  onPan: (args) => cmdLog('pan: not yet implemented', true),
}));

// Register tool commands
registry.register(createToolCommands({
  onActivate: (toolName) => {
    const tools = toolSystem.list();
    const match = tools.find(t => t.id === toolName || t.name.toLowerCase() === toolName);
    if (match) { toolSystem.activate(match.id); renderToolRail(); updateStatus(); }
  },
  listTools: () => toolSystem.list().map(t => t.id),
}));

// Register page commands
registry.register(createPageCommands({
  onNew: (name) => runAndSave(`new-page ${quoteIfNeeded(name)} paper A4 landscape`),
  onSwitch: (name) => doSwitchPage(name),
  onDelete: (name) => runAndSave(`delete-page ${quoteIfNeeded(name)}`),
}));

// Register board commands (pass-through to engine)
registry.register(createBoardCommands({
  runEngine: (cmd) => runAndSave(cmd),
}));

// Register circuit commands (pass-through to engine)
registry.register(createCircuitCommands({
  runEngine: (cmd) => runAndSave(cmd),
}));

// Set fallback: unmatched commands go to engine's runAndSave
registry.setFallback((text) => {
  const lower = text.toLowerCase();
  // Handle help as special case
  if (lower === 'help' || lower === '?') {
    const helpText = registry.help();
    helpText.split('\n').forEach(line => cmdLog(line, true));
    return { success: true, message: 'help shown' };
  }
  if (lower.startsWith('help ')) {
    const group = lower.slice(5).trim();
    const helpText = registry.help(group);
    helpText.split('\n').forEach(line => cmdLog(line, true));
    return { success: true, message: `help ${group} shown` };
  }
  // Tray commands: tray.add, tray.remove, tray.place
  if (lower.startsWith('tray.add ') || lower.startsWith('tray add ')) {
    const part = text.replace(/^tray[.\s]+add\s+/i, '').trim();
    const result = deviceTray.addToTray(part);
    if (trayOpen) renderTrayProject();
    return result.success ? { success: true, message: `Added ${part} to tray` } : { success: false, message: result.error };
  }
  if (lower.startsWith('tray.remove ') || lower.startsWith('tray remove ')) {
    const part = text.replace(/^tray[.\s]+remove\s+/i, '').trim();
    const result = deviceTray.removeFromTray(part);
    if (trayOpen) renderTrayProject();
    return result.success ? { success: true, message: `Removed ${part} from tray` } : { success: false, message: result.error };
  }
  if (lower.startsWith('tray.place ') || lower.startsWith('tray place ')) {
    const part = text.replace(/^tray[.\s]+place\s+/i, '').trim();
    if (!deviceTray.getItem(part)) deviceTray.addToTray(part);
    const result = deviceTray.placeFromTray(part); // auto-position
    if (result.success) {
      const state = engine.getState();
      const texts = syncStateToText(state);
      if (texts.circuit) { CIRCUIT_SRC_LIVE = texts.circuit; circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT); circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 }); }
      if (texts.board) { BOARD_SRC_LIVE = texts.board; boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD); boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 }); }
      renderEditors(); renderViewport(); if (trayOpen) renderTrayProject(); saveProject();
      return { success: true, message: `Placed ${result.ref} (${part}) at (${result.position.x.toFixed(1)}, ${result.position.y.toFixed(1)})` };
    }
    return { success: false, message: result.error };
  }
  if (lower === 'tray' || lower === 'tray.open') {
    openTray();
    return { success: true, message: 'Tray opened' };
  }
  // tray.bom — load BOM JSON into tray
  if (lower.startsWith('tray.bom ') || lower.startsWith('tray bom ')) {
    const jsonStr = text.replace(/^tray[.\s]+bom\s+/i, '').trim();
    try {
      const bom = JSON.parse(jsonStr);
      const result = deviceTray.loadBom(bom);
      if (trayOpen) { renderTrayList(); renderTrayProject(); }
      if (result.errors.length > 0) {
        result.errors.forEach(err => cmdLog(`  warn: ${err}`, false));
      }
      return { success: result.success, message: `BOM loaded: ${result.loaded} parts, ${result.skipped} skipped` };
    } catch (e) {
      return { success: false, message: `Invalid JSON: ${e.message}` };
    }
  }
  // tray.export — export tray as BOM JSON
  if (lower === 'tray.export' || lower === 'tray export') {
    const bom = deviceTray.exportBom();
    const json = JSON.stringify(bom, null, 2);
    cmdLog(json, true);
    return { success: true, message: `Exported ${bom.length} items` };
  }
  // Pass to engine
  return runAndSave(text);
});

/**
 * Command router — uses the OOP command registry.
 * Supports: "save" | "file.save" | "file save" — all work identically.
 */
function executeCommand(text) {
  const raw = text.trim();
  if (!raw) return;
  const result = registry.execute(raw);
  if (result && result.message) {
    cmdLog(result.message, result.success !== false);
  }
}

// --- Tab completion via registry ---
function getCompletionHint(text) {
  const completions = registry.complete(text);
  return completions.length > 0 ? completions[0] : null;
}

function cmdLog(text, success = true) {
  const log = document.getElementById('cmd-log');
  // Show the command with >>> prompt
  const cmdDiv = document.createElement('div');
  cmdDiv.className = 'info';
  cmdDiv.textContent = `>>> ${text}`;
  log.appendChild(cmdDiv);
  // Show result
  const resDiv = document.createElement('div');
  resDiv.className = success ? 'ok' : 'err';
  resDiv.textContent = success ? 'OK' : 'Error: command failed';
  log.appendChild(resDiv);
  log.scrollTop = log.scrollHeight;
}

// ============================================================================
// KEYBOARD SHORTCUTS
// ============================================================================
document.addEventListener('keydown', e => {
  // Don't capture when typing in input
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  const key = e.key;

  // Delete selected device
  if ((key === 'Delete' || key === 'Backspace') && selectedRef) {
    runAndSave(`delete ${selectedRef}`);
    selectedRef = null;
    renderViewport();
    return;
  }

  // Rotate selected device
  if ((key === 'r' || key === 'R') && selectedRef) {
    runAndSave(`rotate ${selectedRef} 90`);
    return;
  }

  // Escape: cancel connect or deselect
  if (key === 'Escape') {
    if (placingPart) {
      placingPart = null;
      document.getElementById('tray-placing').style.display = 'none';
      cmdLog('Placement cancelled', true);
      return;
    }
    if (trayOpen) { closeTray(); return; }
    if (connectToolInst.isActive()) {
      connectToolInst.escape();
      connectPreview = null;
      cmdLog('connect: cancelled', true);
      renderViewport();
    }
    selectedRef = null;
    toolSystem.dispatchShortcut('Escape');
    renderToolRail();
    renderViewport();
    updateStatus();
    return;
  }

  // Tool shortcuts
  const result = toolSystem.dispatchShortcut(key);
  if (result) {
    renderToolRail();
    updateStatus();
    onToolActivate(result.id);
    return;
  }
});

  document.getElementById('st-tool').textContent = active?.name || 'Select';

  const vs = viewport.getViewState();
  document.getElementById('st-zoom').textContent = `${Math.round(vs.zoom)}%`;
}

// ============================================================================
// FILE MENU (New / Open / Save / Save As / Download / Recent)
// ============================================================================
const PROJECTS_KEY = 'components.board.projects';
const RECENT_KEY = 'components.board.recent';
let currentProjectName = 'Untitled';

// --- Menu open/close ---
document.getElementById('menu-file').querySelector('button').addEventListener('click', e => {
  const menu = document.getElementById('menu-file');
  menu.classList.toggle('open');
  if (menu.classList.contains('open')) renderRecentList();
});
document.addEventListener('click', e => {
  if (!e.target.closest('#menu-file')) {
    document.getElementById('menu-file').classList.remove('open');
  }
});

// --- Menu actions ---
document.getElementById('dropdown-file').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  document.getElementById('menu-file').classList.remove('open');

  switch (action) {
    case 'new': fileNew(); break;
    case 'open': fileOpen(); break;
    case 'save': fileSave(); break;
    case 'save-as': fileSaveAs(); break;
    case 'download-circuit': fileDownload('circuit'); break;
    case 'download-board': fileDownload('board'); break;
  }
});

// --- Recent list click ---
document.getElementById('recent-list').addEventListener('click', e => {
  const item = e.target.closest('[data-project]');
  if (item) {
    document.getElementById('menu-file').classList.remove('open');
    fileOpenProject(item.dataset.project);
  }
});

// --- File: New ---
function fileNew() {
  if (!confirm('Create new project? Unsaved changes will be lost.')) return;
  currentProjectName = 'Untitled';
  CIRCUIT_SRC_LIVE = '@page Page1\n';
  BOARD_SRC_LIVE = '@page Page1\npaper A4 landscape;\n';
  // Reset engine (clear all state)
  const state = engine.getState();
  if (state.component?.devices) {
    Object.keys(state.component.devices).forEach(ref => engine.run(`delete ${ref}`));
  }
  circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT);
  boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD);
  circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 });
  boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 });
  activePage = 'Page1';
  renderEditors();
  renderPageTabs();
  renderViewport();
  updateTitle();
  cmdLog('New project created', true);
}

// --- File: Open (from localStorage projects) ---
function fileOpen() {
  const projects = getProjectList();
  if (projects.length === 0) {
    alert('No saved projects. Use File > Save As to save first.');
    return;
  }
  const name = prompt('Open project:\n\n' + projects.map((p, i) => `${i + 1}. ${p}`).join('\n') + '\n\nType name:');
  if (name && name.trim()) fileOpenProject(name.trim());
}

function fileOpenProject(name) {
  const projects = JSON.parse(localStorage.getItem(PROJECTS_KEY) || '{}');
  const data = projects[name];
  if (!data) { alert(`Project "${name}" not found.`); return; }

  currentProjectName = name;
  CIRCUIT_SRC_LIVE = data.circuit || '@page Page1\n';
  BOARD_SRC_LIVE = data.board || '@page Page1\npaper A4 landscape;\n';

  // Reset engine and replay
  const state = engine.getState();
  if (state.component?.devices) {
    Object.keys(state.component.devices).forEach(ref => engine.run(`delete ${ref}`));
  }
  if (data.commands) {
    data.commands.forEach(cmd => engine.run(cmd));
  }

  circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT);
  boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD);
  circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 });
  boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 });
  activePage = data.activePage || getPageNames(circuitFile)[0] || 'Page1';
  renderEditors();
  renderPageTabs();
  renderViewport();
  updateTitle();
  addToRecent(name);
  cmdLog(`Opened "${name}"`, true);
}

// --- File: Save ---
function fileSave() {
  if (currentProjectName === 'Untitled') { fileSaveAs(); return; }
  saveToProjects(currentProjectName);
  cmdLog(`Saved "${currentProjectName}"`, true);
}

// --- File: Save As ---
function fileSaveAs() {
  const name = prompt('Save project as:', currentProjectName === 'Untitled' ? '' : currentProjectName);
  if (!name || !name.trim()) return;
  currentProjectName = name.trim();
  saveToProjects(currentProjectName);
  updateTitle();
  addToRecent(currentProjectName);
  cmdLog(`Saved as "${currentProjectName}"`, true);
}

function saveToProjects(name) {
  const projects = JSON.parse(localStorage.getItem(PROJECTS_KEY) || '{}');
  projects[name] = {
    circuit: CIRCUIT_SRC_LIVE,
    board: BOARD_SRC_LIVE,
    commands: engine.getLog?.() || [],
    activePage,
    savedAt: new Date().toISOString(),
  };
  localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
  document.getElementById('st-save').textContent = '● Saved';
  setTimeout(() => { document.getElementById('st-save').textContent = ''; }, 2000);
}

// --- File: Download ---
function fileDownload(type) {
  const content = type === 'circuit' ? CIRCUIT_SRC_LIVE : BOARD_SRC_LIVE;
  const filename = `${currentProjectName || 'project'}.${type === 'circuit' ? 'circuit' : 'board'}`;
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  cmdLog(`Downloaded ${filename}`, true);
}

// --- Recent projects ---
function getProjectList() {
  const projects = JSON.parse(localStorage.getItem(PROJECTS_KEY) || '{}');
  return Object.keys(projects).sort();
}

function getRecentList() {
  return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]').slice(0, 5);
}

function addToRecent(name) {
  let recent = getRecentList().filter(n => n !== name);
  recent.unshift(name);
  localStorage.setItem(RECENT_KEY, JSON.stringify(recent.slice(0, 5)));
}

function renderRecentList() {
  const recent = getRecentList();
  const el = document.getElementById('recent-list');
  if (recent.length === 0) {
    el.innerHTML = '<div class="recent-empty">No recent projects</div>';
  } else {
    el.innerHTML = recent.map(name =>
      `<button class="recent-item" data-project="${name}">${name}</button>`
    ).join('');
  }
}

// --- Title ---
function updateTitle() {
  document.title = `${currentProjectName} — Components Board`;
}

// --- Keyboard shortcuts for File + Undo/Redo ---
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.ctrlKey && e.key === 'n') { e.preventDefault(); fileNew(); }
  if (e.ctrlKey && e.key === 'o') { e.preventDefault(); fileOpen(); }
  if (e.ctrlKey && !e.shiftKey && e.key === 's') { e.preventDefault(); fileSave(); }
  if (e.ctrlKey && e.shiftKey && e.key === 'S') { e.preventDefault(); fileSaveAs(); }
  // Undo: Ctrl+Z
  if (e.ctrlKey && !e.shiftKey && e.key === 'z') {
    e.preventDefault();
    const result = engine.run('undo');
    if (result.success) {
      const state = engine.getState();
      const texts = syncStateToText(state);
      if (texts.circuit) { CIRCUIT_SRC_LIVE = texts.circuit; circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT); circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 }); }
      if (texts.board) { BOARD_SRC_LIVE = texts.board; boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD); boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 }); }
      renderEditors(); renderViewport(); updateStatus();
      cmdLog('undo', true);
    }
  }
  // Redo: Ctrl+Y or Ctrl+Shift+Z
  if ((e.ctrlKey && e.key === 'y') || (e.ctrlKey && e.shiftKey && e.key === 'Z')) {
    e.preventDefault();
    const result = engine.run('redo');
    if (result.success) {
      const state = engine.getState();
      const texts = syncStateToText(state);
      if (texts.circuit) { CIRCUIT_SRC_LIVE = texts.circuit; circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT); circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 }); }
      if (texts.board) { BOARD_SRC_LIVE = texts.board; boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD); boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 }); }
      renderEditors(); renderViewport(); updateStatus();
      cmdLog('redo', true);
    }
  }
});

// ============================================================================
// RESIZABLE SPLITTERS + COLLAPSE
// ============================================================================

// --- Horizontal splitter (viewport ↔ right panel width) ---
{
  const splitter = document.getElementById('splitter-h');
  const mainEl = document.querySelector('.main');
  const rightPanel = document.getElementById('right-panel');
  let startX, startWidth;

  splitter.addEventListener('mousedown', e => {
    e.preventDefault();
    startX = e.clientX;
    startWidth = rightPanel.offsetWidth;
    splitter.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';

    function onMove(ev) {
      const dx = startX - ev.clientX;
      const newWidth = Math.max(200, Math.min(800, startWidth + dx));
      mainEl.style.gridTemplateColumns = `44px 1fr 6px ${newWidth}px`;
      renderViewport();
    }
    function onUp() {
      splitter.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      renderViewport();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// --- Vertical splitter (editor ↔ terminal height) ---
{
  const splitter = document.getElementById('splitter-v');
  const editorPane = document.getElementById('editor-pane');
  const terminalPane = document.getElementById('terminal-pane');
  let startY, startEditorH, startTermH;

  splitter.addEventListener('mousedown', e => {
    e.preventDefault();
    startY = e.clientY;
    startEditorH = editorPane.offsetHeight;
    startTermH = terminalPane.offsetHeight;
    splitter.classList.add('active');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';

    function onMove(ev) {
      const dy = ev.clientY - startY;
      const newEditorH = Math.max(80, startEditorH + dy);
      const newTermH = Math.max(80, startTermH - dy);
      editorPane.style.flex = 'none';
      editorPane.style.height = newEditorH + 'px';
      terminalPane.style.height = newTermH + 'px';
    }
    function onUp() {
      splitter.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// --- Collapse/expand right panel ---
{
  const btn = document.getElementById('collapse-btn');
  const mainEl = document.querySelector('.main');
  let isCollapsed = false;

  btn.addEventListener('click', () => {
    isCollapsed = !isCollapsed;
    mainEl.classList.toggle('collapsed', isCollapsed);
    btn.textContent = isCollapsed ? '▶' : '◀';
    btn.title = isCollapsed ? 'Show panel (Ctrl+B)' : 'Hide panel (Ctrl+B)';
    setTimeout(renderViewport, 50);
  });

  // Ctrl+B shortcut
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'b' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      btn.click();
    }
  });
}

// ============================================================================
// DEVICE TRAY UI
// ============================================================================
let trayOpenGroups = new Set(['74xx']); // groups expanded by default

function openTray() {
  trayOpen = true;
  document.getElementById('tray-panel').classList.add('open');
  renderTrayList();
  renderTrayProject();
  document.getElementById('tray-search').focus();
}

function closeTray() {
  trayOpen = false;
  placingPart = null;
  deviceTray.cancelPickup();
  document.getElementById('tray-panel').classList.remove('open');
  document.getElementById('tray-placing').style.display = 'none';
}

function renderTrayList() {
  const query = traySearchQuery;
  const el = document.getElementById('tray-list');

  if (query) {
    // Search mode — flat results
    const results = library.search(query, { limit: 30 });
    if (results.length === 0) {
      el.innerHTML = '<div class="tray-empty">No parts found</div>';
      return;
    }
    el.innerHTML = results.map(p => `
      <div class="tray-item" data-part="${p.part}" draggable="true" title="${p.title} · ${p.group} · ${p.pinCount} pins">
        <span class="ti-part">${p.part}</span>
        <span class="ti-title">${p.title}</span>
        <span class="ti-pins">${p.pinCount}p</span>
        <button class="ti-add" data-add="${p.part}" title="Add to tray">+</button>
      </div>
    `).join('');
    return;
  }

  // Tree mode — groups with expandable members
  const groups = library.listGroups().filter(g => g.count > 0);
  let html = '';
  for (const g of groups) {
    const isOpen = trayOpenGroups.has(g.id);
    const parts = isOpen ? library.listParts(g.id) : [];
    html += `<div class="tray-group${isOpen ? ' open' : ''}">`;
    html += `<div class="tray-group-header${isOpen ? ' open' : ''}" data-toggle-group="${g.id}">`;
    html += `<span class="arrow">▶</span>${g.title}<span class="gcount">${g.count}</span>`;
    html += `</div>`;
    html += `<div class="tray-group-items">`;
    for (const p of parts) {
      html += `<div class="tray-item" data-part="${p.part}" draggable="true" title="${p.title} · ${p.pinCount} pins">`;
      html += `<span class="ti-part">${p.part}</span>`;
      html += `<span class="ti-title">${p.title}</span>`;
      html += `<span class="ti-pins">${p.pinCount}p</span>`;
      html += `<button class="ti-add" data-add="${p.part}" title="Add to tray">+</button>`;
      html += `</div>`;
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
}

function renderTrayProject() {
  const items = deviceTray.getItems();
  const el = document.getElementById('tray-project-list');
  if (items.length === 0) {
    el.innerHTML = '<div style="font-size:10px;color:var(--text3);padding:4px 0;">Click + to add parts from library above</div>';
    return;
  }
  el.innerHTML = items.map(item => {
    const remaining = deviceTray.remainingCount(item.part);
    return `
    <div class="tray-project-item" data-tray-part="${item.part}" ${remaining > 0 ? 'draggable="true"' : ''}>
      <span class="tp-part">${item.part}</span>
      <span class="tp-qty">×${item.quantity} (${item.placed.length} placed)</span>
      ${remaining > 0 ? `<button class="tp-place" data-place="${item.part}" title="Pick up and place">▼</button>` : '<span style="font-size:9px;color:var(--text3)">✓ done</span>'}
      <button class="tp-remove" data-remove-tray="${item.part}" title="Remove from tray" style="margin-left:4px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;">×</button>
    </div>`;
  }).join('');
}

// --- Tray event listeners ---
document.getElementById('tray-close').addEventListener('click', closeTray);

// Search
document.getElementById('tray-search').addEventListener('input', e => {
  traySearchQuery = e.target.value.trim();
  renderTrayList();
});

// Tree group toggle
document.getElementById('tray-list').addEventListener('click', e => {
  const toggleBtn = e.target.closest('[data-toggle-group]');
  if (toggleBtn) {
    const gid = toggleBtn.dataset.toggleGroup;
    if (trayOpenGroups.has(gid)) trayOpenGroups.delete(gid);
    else trayOpenGroups.add(gid);
    renderTrayList();
    return;
  }

  // Add to tray
  const addBtn = e.target.closest('[data-add]');
  if (addBtn) {
    e.stopPropagation();
    const part = addBtn.dataset.add;
    deviceTray.addToTray(part);
    renderTrayProject();
    cmdLog(`tray.add ${part}`, true);
    return;
  }
  // Click item row → add to tray
  const item = e.target.closest('[data-part]');
  if (item && !e.target.closest('[data-toggle-group]')) {
    const part = item.dataset.part;
    deviceTray.addToTray(part);
    renderTrayProject();
    cmdLog(`tray.add ${part}`, true);
  }
});

// Project tray: place / remove
document.getElementById('tray-project-list').addEventListener('click', e => {
  const placeBtn = e.target.closest('[data-place]');
  if (placeBtn) {
    const part = placeBtn.dataset.place;
    placingPart = part;
    deviceTray.pickup(part);
    document.getElementById('tray-placing').textContent = `Click board to place ${part} — Esc to cancel`;
    document.getElementById('tray-placing').style.display = 'block';
    cmdLog(`Picked up ${part} — click on board to place`, true);
    return;
  }
  const removeBtn = e.target.closest('[data-remove-tray]');
  if (removeBtn) {
    const part = removeBtn.dataset.removeTray;
    deviceTray.removeFromTray(part);
    renderTrayProject();
    cmdLog(`tray.remove ${part}`, true);
  }
});

// Click viewport to place part (pickup mode)
document.getElementById('svg').addEventListener('click', e => {
  if (!placingPart) return;
  
  const svgEl = document.getElementById('svg');
  const r = svgEl.getBoundingClientRect();
  const world = viewport.screenToWorld(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
  
  const result = deviceTray.placeFromTray(placingPart, { x: world.x, y: world.y });
  if (result.success) {
    // Twin sync after placement
    const state = engine.getState();
    const texts = syncStateToText(state);
    if (texts.circuit) { CIRCUIT_SRC_LIVE = texts.circuit; circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT); circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 }); }
    if (texts.board) { BOARD_SRC_LIVE = texts.board; boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD); boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 }); }
    renderEditors();
    renderViewport();
    renderTrayProject();
    cmdLog(`Placed ${result.ref} (${placingPart}) at (${result.position.x.toFixed(1)}, ${result.position.y.toFixed(1)})`, true);
    saveProject();
    
    // Keep placing if more remaining
    if (deviceTray.remainingCount(placingPart) <= 0) {
      placingPart = null;
      deviceTray.cancelPickup();
      document.getElementById('tray-placing').style.display = 'none';
    }
  } else {
    cmdLog(`Place failed: ${result.error}`, false);
    placingPart = null;
    deviceTray.cancelPickup();
    document.getElementById('tray-placing').style.display = 'none';
  }
});

// ============================================================================
// DRAG-TO-PLACE — drag from tray/library onto viewport
// ============================================================================

// Dragstart on library/tray items
document.getElementById('tray-panel').addEventListener('dragstart', e => {
  const item = e.target.closest('[data-part]') || e.target.closest('[data-tray-part]');
  if (!item) return;
  const part = item.dataset.part || item.dataset.trayPart;
  if (!part) return;

  e.dataTransfer.setData('text/plain', part);
  e.dataTransfer.effectAllowed = 'copy';

  // Start the headless drag state machine
  const result = dragPlace.dragStart(part, { x: e.clientX, y: e.clientY });
  if (!result.success) {
    e.preventDefault();
    return;
  }
  document.getElementById('tray-placing').textContent = `Drag ${part} onto board`;
  document.getElementById('tray-placing').style.display = 'block';
});

// Dragover on viewport SVG — allow drop
document.getElementById('svg').addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';

  const svgEl = document.getElementById('svg');
  const r = svgEl.getBoundingClientRect();
  dragPlace.dragMove(
    { x: e.clientX, y: e.clientY },
    { left: r.left, top: r.top, width: r.width, height: r.height }
  );
});

// Drop on viewport SVG — place part
document.getElementById('svg').addEventListener('drop', e => {
  e.preventDefault();
  const svgEl = document.getElementById('svg');
  const r = svgEl.getBoundingClientRect();

  const result = dragPlace.dragEnd(
    { x: e.clientX, y: e.clientY },
    { left: r.left, top: r.top, width: r.width, height: r.height }
  );

  document.getElementById('tray-placing').style.display = 'none';

  if (result.success) {
    // Twin sync after placement
    const state = engine.getState();
    const texts = syncStateToText(state);
    if (texts.circuit) { CIRCUIT_SRC_LIVE = texts.circuit; circuitFile = parseFile(CIRCUIT_SRC_LIVE, FILE_TYPES.CIRCUIT); circuitEditor = createEditor(CIRCUIT_SRC_LIVE, { visibleLines: 30 }); }
    if (texts.board) { BOARD_SRC_LIVE = texts.board; boardFile = parseFile(BOARD_SRC_LIVE, FILE_TYPES.BOARD); boardEditor = createEditor(BOARD_SRC_LIVE, { visibleLines: 30 }); }
    renderEditors();
    renderViewport();
    renderTrayProject();
    cmdLog(`Dropped ${result.ref} (${result.part}) at (${result.position.x.toFixed(1)}, ${result.position.y.toFixed(1)})`, true);
    saveProject();
  } else {
    cmdLog(`Drop failed: ${result.error}`, false);
  }
});

// Dragend — clean up if drag cancelled (dropped outside viewport)
document.addEventListener('dragend', e => {
  if (dragPlace.isDragging()) {
    dragPlace.dragCancel();
    document.getElementById('tray-placing').style.display = 'none';
  }
});

// ============================================================================
// TOOL RAIL — wire tray tool open/close
// ============================================================================
function onToolActivate(toolId) {
  if (toolId === 'tray') {
    if (trayOpen) closeTray(); else openTray();
  } else {
    closeTray();
  }
}

// ============================================================================
// INIT
// ============================================================================
viewport.zoomFit(800, 500);
renderToolRail();
renderEditors();
renderPageTabs();
renderViewport();
updateStatus();
updateTitle();
preloadSVGAssets(); // async — loads chip frame SVGs in background
cmdLog(`${currentProjectName} — ${getPageNames(circuitFile).length} pages loaded`, true);
cmdLog('Type commands, or use File menu to manage projects', true);
window.addEventListener('resize', renderViewport);
</script>
